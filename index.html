用JavaScript；關咗都仲可以睇法語靜態正文。"},"timelineFirst":{"fr":"Première élection","en":"First election","zh-Hans":"首次选举","yue-Hant":"首次選舉"},"eyebrowElection":{"fr":"LE SCRUTIN","en":"THE BALLOT","zh-Hans":"这次选什么","yue-Hant":"今次選乜"},"eyebrowDistrict":{"fr":"LE TERRITOIRE","en":"THE PLACE","zh-Hans":"选区范围","yue-Hant":"選區範圍"},"eyebrowPeople":{"fr":"LA POPULATION","en":"THE COMMUNITY","zh-Hans":"人口背景","yue-Hant":"人口背景"},"eyebrowCandidates":{"fr":"LES SEPT CANDIDATURES","en":"THE SEVEN CANDIDATES","zh-Hans":"七位候选人","yue-Hant":"七位候選人"},"eyebrowReview":{"fr":"EXAMEN DES SOURCES PUBLIQUES","en":"PUBLIC-RECORD REVIEW","zh-Hans":"公开记录核查","yue-Hant":"公開記錄核查"},"eyebrowSources":{"fr":"SOURCES ET NOTES","en":"SOURCES & NOTES","zh-Hans":"来源及说明","yue-Hant":"來源同說明"},"labelProvincial":{"fr":"QUÉBEC · PROVINCIAL","en":"QUÉBEC · PROVINCIAL","zh-Hans":"魁北克 · 省级","yue-Hant":"魁北克 · 省級"},"labelFederal":{"fr":"CANADA · FÉDÉRAL","en":"CANADA · FEDERAL","zh-Hans":"加拿大 · 联邦","yue-Hant":"加拿大 · 聯邦"},"researchScope":{"fr":"Les thèmes de recherche incluent controversy, complaint, sanction, court, controverse, plainte et congédiement. Les notes de recherche précisent les limites; il ne s’agit pas d’un examen exhaustif des registres judiciaires.","en":"Search themes include controversy, complaint, sanction, court, controverse, plainte and congédiement. The research notes explain the limits; this is not an exhaustive court-registry review.","zh-Hans":"检索主题包括争议、投诉、处罚、法院与解雇，并使用相应法英关键词。仓库的研究说明列出范围和限制；这不是完整司法登记查询。","yue-Hant":"檢索主題包括爭議、投訴、處分、法院同解僱，用咗相應法英關鍵字。倉庫研究說明列明範圍同限制，唔係查晒司法登記。"}},"sections":{"electionTitle":{"fr":"On élit un député provincial, pas un député fédéral.","en":"A provincial MNA, not a federal MP.","zh-Hans":"这次选省议员，不是联邦国会议员。","yue-Hant":"今次選省議員，唔係聯邦MP。"},"electionIntro":{"text":{"fr":"L’élection renouvelle l’Assemblée nationale du Québec et détermine qui peut former un gouvernement ayant sa confiance. Ce n’est ni une reprise de l’élection fédérale ni un référendum sur l’indépendance.","en":"This election renews Québec’s National Assembly and determines who can form a government with its confidence. It is neither a rerun of the federal election nor an independence referendum.","zh-Hans":"本次选举产生新一届魁北克国民议会，并决定谁能组成获得议会信任的省政府。它不是联邦选举重选，也不是魁北克独立公投。","yue-Hant":"今次係選出新一屆魁北克省議會，再由取得議會信任嘅政府執政。唔係聯邦選舉重選，更加唔係魁獨公投。"},"refs":[2,3]},"provincialTitle":{"fr":"Député provincial / MNA","en":"Provincial MNA","zh-Hans":"MNA · 魁北克省议员","yue-Hant":"MNA · 魁北克省議員"},"provincialText":{"text":{"fr":"Vous choisissez une personne dans Robert-Baldwin. Le plus grand nombre de voix suffit pour gagner la circonscription. Les députés siègent à Québec, votent les lois et le budget et surveillent le gouvernement. Il n’y a pas de bulletin distinct pour choisir directement le premier ministre.","en":"You choose one candidate in Robert-Baldwin. The candidate with the most votes wins the district. MNAs sit in Québec City, pass laws and budgets, and hold government accountable. There is no separate ballot directly electing the premier.","zh-Hans":"你在Robert-Baldwin候选人中选择一位，得票最多者当选。省议员在魁北克市参与立法、审议预算并监督政府。选民不会另投一张票直接选省长。","yue-Hant":"你喺Robert-Baldwin揀一位候選人，最高票嗰位就當選。省議員去魁北克市立法、審預算同監督政府；唔會再有另一張票直接選省長。"},"refs":[2,3]},"provincialScope":{"text":{"fr":"Compétences importantes : santé, éducation, droit civil, cadre municipal et impôts provinciaux.","en":"Key responsibilities: health care, education, civil law, municipal institutions and provincial taxes.","zh-Hans":"主要涉及医疗、教育、民事法律、市政制度和省级税收。","yue-Hant":"主要影響醫療、教育、民事法律、市政制度同省稅。"},"refs":[3]},"federalTitle":{"fr":"Député fédéral / MP","en":"Federal MP","zh-Hans":"MP · 联邦国会议员","yue-Hant":"MP · 聯邦國會議員"},"federalText":{"text":{"fr":"À une élection fédérale, vous élisez un député à la Chambre des communes, à Ottawa. Les limites fédérales ne sont pas forcément les mêmes. Le premier ministre fédéral n’est pas non plus élu par un bulletin national distinct.","en":"A federal election chooses your MP for the House of Commons in Ottawa. Federal district boundaries may differ. Canada’s prime minister is not elected through a separate nationwide ballot either.","zh-Hans":"联邦选举选出前往渥太华众议院的国会议员。联邦选区与省选区的边界可以不同，加拿大总理同样不是由一张全国性选票直接选出。","yue-Hant":"聯邦選舉就係選MP去Ottawa眾議院。聯邦選區未必同省選區一樣；總理都唔係靠另一張全國選票直接選出。"},"refs":[3,4]},"federalScope":{"text":{"fr":"Défense, affaires étrangères, droit criminel et fiscalité fédérale. Immigration, logement et infrastructures impliquent souvent plusieurs ordres de gouvernement.","en":"Defence, foreign affairs, criminal law and federal taxation. Immigration, housing and infrastructure often involve more than one level of government.","zh-Hans":"主要涉及国防、外交、刑事法律和联邦税收。移民、住房、基础设施等往往需要多级政府合作。","yue-Hant":"主要管國防、外交、刑事法律同聯邦稅。移民、住房同基建好多時都要幾級政府合作。"},"refs":[3]},"whyAgain":{"text":{"fr":"Pourquoi encore voter? La dernière élection provinciale remonte à 2022. Le scrutin de 2026 suit le cycle provincial de quatre ans; les élections fédérales et municipales ont leurs propres calendriers.","en":"Why another election? The last provincial election was in 2022. The 2026 vote follows Québec’s four-year cycle; federal and municipal elections run on separate calendars.","zh-Hans":"为什么感觉又要选举？上次魁北克省选在2022年，本次是四年后的2026年。联邦选举和市选另有时间表。","yue-Hant":"點解好似成日都要選？上次省選係2022年，今次就係四年後嘅2026年。聯邦同市選有自己嘅時間表。"},"refs":[2]},"new127":{"text":{"fr":"En 2026, il y a 127 circonscriptions provinciales, contre 125 auparavant. Dans la région de Montréal, les limites de 2017 sont conservées. Les partis provinciaux et fédéraux homonymes ne figurent pas sur le même bulletin.","en":"Québec has 127 provincial districts for 2026, up from 125. Montréal retains its 2017 boundaries. Provincial and federal parties with similar names are not choices on the same ballot.","zh-Hans":"2026年全省选区由125个增至127个；蒙特利尔地区沿用2017年边界。同名的省级与联邦政党，不是同一张选票上的选项。","yue-Hant":"2026年全省由125區加到127區，Montréal沿用2017年邊界。同名嘅省黨同聯邦黨，唔係同一張選票上嘅選項。"},"refs":[4,5]},"districtTitle":{"fr":"DDO est une ville. Robert-Baldwin est une circonscription.","en":"DDO is a city. Robert-Baldwin is an electoral district.","zh-Hans":"DDO是城市，Robert-Baldwin是选区。","yue-Hant":"DDO係城市，Robert-Baldwin係選區。"},"districtIntro":{"text":{"fr":"Une circonscription sert à élire un député et peut traverser des limites municipales. Elle n’est pas une autre administration municipale.","en":"A riding is used to elect a representative and may cross municipal boundaries. It is not another municipal government.","zh-Hans":"选区是选举议员使用的地理单位，可以跨越市界，并不是另一个市政府。","yue-Hant":"選區係用嚟選議員嘅地理範圍，可以跨市界，唔係另一個市政府。"},"refs":[6,12]},"districtAreaTitle":{"fr":"Le territoire","en":"What it includes","zh-Hans":"包括哪些地方？","yue-Hant":"包括邊啲地方？"},"districtFormula":{"fr":"Tout Dollard-des-Ormeaux + une partie de Montréal","en":"All of Dollard-des-Ormeaux + part of Montréal","zh-Hans":"整个Dollard-des-Ormeaux ＋ 蒙特利尔的一部分","yue-Hant":"成個Dollard-des-Ormeaux ＋ Montréal嘅一部分"},"districtArea":{"text":{"fr":"Toute la ville de DDO, plus une partie de l’arrondissement Pierrefonds-Roxboro de Montréal. Ce n’est ni tout l’arrondissement ni tout l’Ouest-de-l’Île. Pointe-Claire, Kirkland et Beaconsfield n’en font pas partie.","en":"All of DDO, plus part of Montréal’s Pierrefonds-Roxboro borough. Not the whole borough or the whole West Island. Pointe-Claire, Kirkland and Beaconsfield are not included.","zh-Hans":"包括整个DDO市，以及蒙特利尔Pierrefonds-Roxboro行政区的一部分。并非整个行政区或整个西岛；不包括Pointe-Claire、Kirkland和Beaconsfield。","yue-Hant":"包括成個DDO，再加Montréal嘅Pierrefonds-Roxboro其中一部分。唔係成個borough或者成個西島；Pointe-Claire、Kirkland同Beaconsfield唔喺呢區。"},"refs":[9,12]},"boundary":{"text":{"fr":"La portion montréalaise est délimitée notamment par le boulevard de Pierrefonds, le boulevard des Sources et son prolongement, la limite de l’arrondissement, la rue Sommerset et le boulevard Jacques-Bizard. Pour une adresse limitrophe, consulter la carte officielle.","en":"The Montréal portion is bounded by boulevard de Pierrefonds, boulevard des Sources and its extension, the borough boundary, rue Sommerset and boulevard Jacques-Bizard. Use the official map for boundary addresses.","zh-Hans":"蒙特利尔部分的界线涉及boulevard de Pierrefonds、boulevard des Sources及其延长线、行政区边界、rue Sommerset和boulevard Jacques-Bizard。边界附近的具体住址应以官方地图核对。","yue-Hant":"Montréal部分嘅界線包括boulevard de Pierrefonds、boulevard des Sources同延長線、borough邊界、rue Sommerset同boulevard Jacques-Bizard。住近邊界要用官方圖逐個地址核對。"},"refs":[9,12]},"historyTitle":{"fr":"Pourquoi ce nom?","en":"Why the name?","zh-Hans":"名称从何而来？","yue-Hant":"個名點嚟？"},"history":{"text":{"fr":"Robert Baldwin (1804–1858), avocat et réformiste du Haut-Canada, a collaboré avec Louis-Hippolyte LaFontaine à l’établissement du gouvernement responsable : le gouvernement doit répondre aux élus, pas seulement au gouverneur colonial.","en":"Robert Baldwin (1804–1858) was an Upper Canadian lawyer and reform politician. With Louis-Hippolyte LaFontaine, he helped establish responsible government: government accountable to elected representatives, not just the colonial governor.","zh-Hans":"Robert Baldwin（1804–1858）是上加拿大律师和改革派政治人物。他与Louis-Hippolyte LaFontaine合作推动“责任政府”，即政府须向民选议会负责，而非只向殖民地总督负责。","yue-Hant":"Robert Baldwin（1804–1858）係上加拿大律師同改革派政治人物，同Louis-Hippolyte LaFontaine一齊推動「責任政府」：政府要向民選議會交代，唔係淨係向殖民地總督交代。"},"refs":[7]},"historyDates":{"text":{"fr":"Créée en 1965 à partir de Jacques-Cartier, la circonscription a été utilisée pour la première fois en 1966. DDO n’a donc pas été rebaptisée Robert-Baldwin.","en":"Created in 1965 from Jacques-Cartier, the district was first contested in 1966. DDO was not renamed Robert-Baldwin.","zh-Hans":"选区于1965年从Jacques-Cartier划出，1966年首次用于省选。DDO并没有改名为Robert-Baldwin。","yue-Hant":"1965年由Jacques-Cartier拆出呢個選區，1966年第一次用嚟省選。所以唔係DDO改咗名叫Robert-Baldwin。"},"refs":[6,8]},"mapTitle":{"fr":"Carte officielle, visible directement","en":"Official map, directly on the page","zh-Hans":"官方选区地图 · 直接显示","yue-Hant":"官方選區地圖 · 打開就睇到"},"mapNote":{"text":{"fr":"Image statique de la page 1 du PDF officiel de 2026. Une fois le site construit, aucun lecteur PDF ni chargement externe n’est nécessaire. Les noms officiels sur la carte restent en français.","en":"Static image of page 1 of the official 2026 PDF. After the site is built, no PDF viewer or external loading is required. Official labels on the map remain in French.","zh-Hans":"使用2026年官方PDF第1页生成静态截图。网站构建完成后，无需PDF阅读器或外部加载即可查看；原图地名保留法语。","yue-Hant":"用2026年官方PDF第1頁整成靜態截圖。網站構建好之後，唔使PDF閱讀器，亦唔使再向外站載入；原圖地名保留法語。"},"refs":[9]},"peopleTitle":{"fr":"La population, avec l’année de référence.","en":"Population, with the reference year.","zh-Hans":"人口组成，也要看统计年份。","yue-Hant":"睇人口數字，都要睇年份。"},"peopleIntro":{"text":{"fr":"Ces chiffres sont issus du recensement de 2021, repris par Le Québec Vote pour la circonscription. Ils ne décrivent pas une population mesurée en temps réel en 2026.","en":"These are 2021 census figures compiled for the district by Le Québec Vote. They are not real-time 2026 population measurements.","zh-Hans":"以下来自Le Québec Vote按选区整理的2021年人口普查数据，并非2026年即时人口。","yue-Hant":"以下係Le Québec Vote按選區整理嘅2021年普查數字，唔係2026年即時人口。"},"refs":[12]},"peopleLanguages":{"text":{"fr":"Le reportage local de CityNews décrit une importante population anglophone et plusieurs communautés linguistiques. L’immigration, la langue maternelle, l’origine et le droit de vote sont des notions distinctes; aucune préférence politique ne s’en déduit.","en":"CityNews describes a substantial English-speaking population and multiple language communities. Immigration, mother tongue, background and voting eligibility are different measures; none determines a person’s politics.","zh-Hans":"CityNews报道指出区内有相当规模的英语人口和多个语言社群。移民身份、母语、族裔及投票资格是不同概念，不能据此推断居民的政治选择。","yue-Hant":"CityNews話區內有唔少英語人口，亦有多個語言社群。移民身份、母語、族裔同投票資格唔係同一回事，唔可以用呢啲數字估人哋會投邊黨。"},"refs":[13]},"peopleLimits":{"fr":"Le pourcentage précis de « langue maternelle française » n’est pas repris : la définition de la variable accessible n’était pas assez claire. Les mineurs et les personnes sans droit de vote sont inclus dans la population.","en":"A precise “French mother tongue” percentage is not repeated because the accessible variable definition was unclear. The population includes children and people ineligible to vote.","zh-Hans":"本页不沿用“27.1%法语母语”的说法，因为可读来源的字段定义不足以支持这一转述。人口总数也包括未成年人和不具投票资格的人。","yue-Hant":"本頁唔沿用「27.1%法語母語」嗰個講法，因為可讀資料嘅欄位定義唔夠清楚。總人口亦包括未成年同冇投票資格嘅人。"},"candidatesTitle":{"fr":"Les sept candidatures, une par une.","en":"All seven candidates, one by one.","zh-Hans":"七位候选人，逐一了解。","yue-Hant":"七位候選人，逐個睇。"},"candidatesIntro":{"text":{"fr":"Les biographies proviennent surtout des partis. Les priorités personnelles sont séparées des engagements provinciaux, qui ne sont pas des réalisations acquises. La liste officielle fait foi.","en":"Biographies primarily use party sources. Personal priorities are separated from province-wide promises, which are not completed achievements. The official candidate list is authoritative.","zh-Hans":"履历主要依据政党发布的候选人介绍。本人主张与全省政纲分开列示，竞选承诺不等于已经落实。最终名单以选举机构为准。","yue-Hant":"履歷主要用政黨嘅候選人介紹。本人講過嘅嘢同全省政綱分開寫，承諾唔等於已經做到。最終名單以選舉機構為準。"},"refs":[11,12]},"axesNote":{"fr":"L’axe économique et social ne suffit pas : le fédéralisme, l’autonomie et l’indépendance sont une autre dimension. Les descriptions ci-dessous ne sont ni des scores ni des recommandations.","en":"Economic and social left–right labels are only one dimension; federalism, autonomy and independence are another. These descriptions are not scores or endorsements.","zh-Hans":"经济社会政策的左右取向，与联邦制、自主权或独立立场，是不同维度。下列描述不是评分，也不是推荐。","yue-Hant":"經濟社會政策嘅左右，同聯邦制、自主權或者獨立，係兩條唔同軸。下面係描述，唔係打分，亦唔係推薦。"},"acronymNote":{"text":{"fr":"Pour éviter la confusion, PCQ désigne ici le Parti conservateur du Québec et PaCQ le Parti canadien du Québec, qui utilise aussi CaPQ en anglais. Ce sont deux partis distincts.","en":"To avoid confusion, PCQ here means the Conservative Party of Québec and PaCQ the Canadian Party of Québec, which also uses CaPQ in English. They are separate parties.","zh-Hans":"为避免缩写混淆，本页用PCQ指魁北克保守党，PaCQ指魁北克加拿大党（其英语页面也用CaPQ）。两者是不同政党。","yue-Hant":"驚縮寫搞亂，呢頁PCQ係保守黨，PaCQ係加拿大黨，後者英文頁亦用CaPQ。呢兩個係唔同政黨。"},"refs":[15,29]},"reviewIntro":{"fr":"Recherche publique ciblée, arrêtée au 4 octobre 2026. On distingue les faits établis, les allégations attribuées et les informations insuffisantes. Aucun score d’intégrité et aucune culpabilité par association avec un autre membre du parti.","en":"A targeted public-web review as of 4 October 2026. Established facts, attributed allegations and insufficient evidence are kept separate. No integrity scores and no guilt by association with other party members.","zh-Hans":"截至2026年10月4日的定向公开网络检索。区分已证实事实、注明来源的指控和证据不足事项。不设“诚信评分”，也不把同党其他人的问题算到候选人头上。","yue-Hant":"截至2026年10月4日做過定向公開網絡檢索。已證實、有人提出指控，同資料未夠，會分清楚。唔設「誠信分數」，亦唔將同黨其他人嘅事算落候選人度。"},"reviewMethod":{"fr":"Méthode : noms exacts, recherches en français et en anglais autour des controverses, plaintes, sanctions et procédures. Les homonymes, rumeurs sans preuve et éléments purement privés ont été écartés. Cette recherche n’est pas une vérification judiciaire exhaustive.","en":"Method: exact names, French and English searches involving controversies, complaints, sanctions and proceedings. Homonyms, unsubstantiated rumours and purely private gossip were excluded. This is not an exhaustive legal-record check.","zh-Hans":"方法：以准确姓名配合法英关键词查找争议、投诉、处罚及司法程序。排除同名人士、无依据传闻及纯私人八卦。本次工作不是完整司法背景调查。","yue-Hant":"做法係用準確姓名加法英關鍵字，搵爭議、投訴、處分同司法程序。同名人士、冇證據傳聞同純私人八卦唔收錄。今次唔係完整司法背景調查。"},"garceauReviewTitle":{"fr":"2023 : fin de contrat d’une attachée politique","en":"2023: political aide’s contract termination","zh-Hans":"2023年：政治助理合同终止报道","yue-Hant":"2023年：政治助理合約終止報道"},"garceauReview":{"text":{"fr":"Webdo, le 1er novembre 2023, reprend le récit attribué par Radio-Canada à une employée anonyme : son contrat aurait pris fin après des mentions « J’aime » pro-palestiniennes.","en":"Webdo on 1 November 2023 relays an anonymous employee’s account attributed to Radio-Canada: her contract reportedly ended after pro-Palestinian social-media likes.","zh-Hans":"Webdo于2023年11月1日转述其称来自Radio-Canada的匿名雇员说法：她的合同据称在为亲巴勒斯坦社交帖文点赞后终止。","yue-Hant":"Webdo喺2023年11月1日轉述佢話來自Radio-Canada嘅匿名僱員說法：合約據稱喺為親巴勒斯坦帖文讚好之後終止。"},"refs":[38]},"garceauResponse":{"fr":"Le reportage original, une réponse complète de Garceau et une décision ultérieure n’ont pas pu être vérifiés ici. Ce lien ne prouve pas une faute établie.","en":"The original report, Garceau’s full response and any subsequent ruling could not be verified here. This link does not establish misconduct.","zh-Hans":"本次未能核实原始报道、Garceau的完整回应或后续裁决，不能据此认定不当行为已成立。","yue-Hant":"今次未能核實原始報道、Garceau完整回應或者後續裁決，唔可以當成已證實違規。"},"sourcesTitle":{"fr":"Des sources, et leurs limites.","en":"Sources, with their limits.","zh-Hans":"每项资料，都说明来源与局限。","yue-Hant":"邊句有來源，邊句未核實。"},"sourcesIntro":{"fr":"Les références numérotées ouvrent les documents d’origine. Les titres officiels et les noms propres restent dans leur langue originale; l’analyse et l’interface sont disponibles dans les quatre langues.","en":"Numbered references open original documents. Official titles and proper names retain their original language; the analysis and interface are available in all four languages.","zh-Hans":"数字引用可以打开原始资料。官方文献标题和专有名称保留原文，正文分析与界面均提供四种语言。","yue-Hant":"數字引用可以開原始資料。官方文件標題同專有名詞保留原文，正文同介面都有四個語言版本。"},"sourcesMethod":{"fr":"Les institutions publiques servent pour les règles et les cartes. Les partis attestent ce qu’ils proposent, pas l’efficacité future de leurs politiques. Un article secondaire est signalé comme tel. Cette version ne se met pas à jour toute seule.","en":"Public institutions support rules and maps. Parties establish what they propose, not whether it will work. Secondary reporting is labelled. This edition does not update its factual content automatically.","zh-Hans":"选举规则和地图优先采用公共机构资料。政党资料能证明其提出了什么，不能证明政策一定有效。二手报道明确标注。本页不会自动重新查证或更新事实。","yue-Hant":"選舉規則同地圖優先用公共機構資料。政黨資料只證明佢提出過乜，唔證明一定有效。二手報道會標明。呢页唔會自動重新查證或者更新事實。"},"rightsNote":{"fr":"Photos et logos servent à l’identification, sans soutien implicite. Ils restent soumis aux droits de leurs titulaires; la licence du code ne leur est pas applicable. Les logos peuvent correspondre à une version antérieure, signalée dans les crédits.","en":"Photos and logos identify people and parties without implying endorsement. Their owners retain their rights; the code licence does not cover them. Some logo editions are older and are identified in the credits.","zh-Hans":"照片和标识仅用于人物、政党识别，不表示背书。相关权利归原权利人，源码许可不适用于第三方素材；部分标识为较早版本，已在素材说明中标注。","yue-Hant":"相片同標誌只用嚟認人同認黨，唔代表背書。版權仍屬原權利人，源碼授權唔包第三方素材；部分logo係較早版本，素材說明有標記。"},"privacyNote":{"fr":"Aucun suivi analytique, publicité ou formulaire de collecte. Le choix de langue peut être mémorisé localement. Après le build, les médias sont hébergés avec le site; les liens externes ne s’ouvrent qu’à votre demande.","en":"No analytics, advertisements or data-collection forms. Language preference may be stored locally. After the build, media are hosted with the site; external links open only when requested.","zh-Hans":"不含统计跟踪、广告或信息收集表单。语言偏好可保存在本地。构建后素材随网站本地托管，外部链接仅在点击后打开。","yue-Hant":"冇分析追蹤、廣告或者資料收集表格。語言選擇可以記喺本機。構建後素材同網站一齊托管，外部連結要你點先開。"},"disclaimer":{"fr":"Guide non officiel, sans affiliation partisane. Les originaux officiels prévalent pour les conditions et modalités. Les traductions sont rédactionnelles, non certifiées; Élections Québec fait foi pour les candidatures, limites et modalités de vote.","en":"Unofficial guide with no party affiliation. Official originals govern conditions and arrangements. Translations are editorial, not certified; Élections Québec is authoritative for candidacies, boundaries and voting arrangements.","zh-Hans":"本页为非官方整理，不隶属任何政党。各项条件以官方原文为准；翻译为编辑性摘要，未经专业认证。候选人资格、选区及投票安排最终以Élections Québec为准。","yue-Hant":"呢頁係非官方整理，唔屬於任何政黨。各項條件要以官方原文為準；翻譯係編輯摘要，未經專業認證。候選人資格、選區同投票安排以Élections Québec為準。"}},"candidates":[{"id":"danylewich","name":"Paul Henry Danylewich","party":"PaCQ","partyFull":"Parti canadien du Québec","partyName":{"fr":"Parti canadien du Québec","en":"Canadian Party of Québec","zh-Hans":"魁北克加拿大党","yue-Hant":"魁北克加拿大黨"},"color":"#8b4556","constitution":{"fr":"Fédéraliste","en":"Federalist","zh-Hans":"联邦派","yue-Hant":"聯邦派"},"summary":{"fr":"Droits individuels, baisse d’impôts, concurrence","en":"Individual rights, tax cuts, competition","zh-Hans":"个人权利、减税、市场竞争","yue-Hant":"個人權利、減稅、市場競爭"},"bio":{"text":{"fr":"Organisateur communautaire et entrepreneur en aménagement paysager, actif en prévention des agressions. Formation à Concordia et maîtrise en leadership pédagogique à Western New Mexico University. Président de l’Association des citoyens de Dollard, selon sa biographie de parti.","en":"Community organizer, landscaping business owner and assault-prevention educator. Studied at Concordia and holds an educational leadership master’s from Western New Mexico University. His party biography identifies him as president of the Association of Citizens of Dollard.","zh-Hans":"社区组织者、园艺企业经营者，从事防袭击与个人安全培训。曾在Concordia学习，教育领导硕士来自Western New Mexico University。政党履历列其为Dollard居民协会主席。","yue-Hant":"社區組織者、園藝公司經營者，做過防襲擊同個人安全培訓。喺Concordia讀過書，教育領導碩士來自Western New Mexico University。黨方履歷寫佢係Dollard居民協會主席。"},"refs":[14]},"personal":{"text":{"fr":"Mobilisation des résidents de DDO sur les inondations, la responsabilité en matière d’infrastructures, la sécurité et les petites entreprises.","en":"DDO resident organizing around flooding, infrastructure accountability, public safety and small businesses.","zh-Hans":"围绕DDO水浸问题组织居民行动，关注基础设施问责、公共安全和小企业。","yue-Hant":"圍繞DDO水浸問題組織居民，關心基建問責、公共安全同小生意。"},"refs":[14]},"orientation":{"text":{"fr":"Fédéralisme canadien affirmé et protection des droits individuels et linguistiques; propositions économiques favorisant la baisse d’impôts et la concurrence.","en":"Strong Canadian federalism and individual and language rights; economic proposals favour tax cuts and competition.","zh-Hans":"鲜明的加拿大联邦派，强调个人及语言权利；经济政策倾向减税和市场竞争。","yue-Hant":"立場鮮明嘅加拿大聯邦派，重視個人同語言權利；經濟上偏向減稅同市場競爭。"},"refs":[15,16]},"policies":[{"title":{"fr":"Droits et fédéralisme","en":"Rights & federalism","zh-Hans":"权利与联邦制","yue-Hant":"權利同聯邦制"},"text":{"fr":"S’oppose à l’indépendance et critique les restrictions aux droits associées notamment aux lois 21 et 96.","en":"Opposes independence and criticizes rights restrictions associated with laws including Bills 21 and 96.","zh-Hans":"反对独立，批评包括21号、96号法案在内的权利限制。","yue-Hant":"反對獨立，批評21號、96號等法案對權利嘅限制。"},"refs":[15,16]},{"title":{"fr":"Coût de la vie","en":"Cost of living","zh-Hans":"生活成本","yue-Hant":"生活成本"},"text":{"fr":"Baisse d’impôts, concurrence en alimentation et incitatifs à la construction de logements.","en":"Tax cuts, grocery competition and housing-construction incentives.","zh-Hans":"减税、增加食品零售竞争，并以激励措施增加住房建设。","yue-Hant":"減稅、增加食品零售競爭，用誘因推動建屋。"},"refs":[15]},{"title":{"fr":"Services et inondations","en":"Services & flooding","zh-Hans":"公共服务与防洪","yue-Hant":"公共服務同防洪"},"text":{"fr":"Financement public des soins avec offre encadrée mixte. Le fonds anti-inondations proposé reste décrit comme une ébauche de travail.","en":"Publicly funded care with regulated mixed delivery. The proposed flood fund is still labelled a working draft.","zh-Hans":"公费医疗结合受监管的多种服务供应；拟议防洪基金仍标为工作草案。","yue-Hant":"公費醫療配合受監管嘅多種服務供應；防洪基金方案仲標住係工作草案。"},"refs":[15]}],"limits":{"fr":"La page personnelle n’établit pas un budget local finalisé ni un échéancier exhaustif.","en":"The personal profile does not establish a finalized local budget or comprehensive timetable.","zh-Hans":"个人介绍未提供定案的本区预算或完整时间表。","yue-Hant":"個人介紹冇提供已定案嘅本區預算同完整時間表。"},"links":[14,15,16],"review":"not-found","portrait":"photo-danylewich","logo":"logo-pacq"},{"id":"daude","name":"Maurice Daude","party":"PQ","partyFull":"Parti Québécois","partyName":{"fr":"Parti Québécois","en":"Parti Québécois","zh-Hans":"魁北克人党","yue-Hant":"魁北克人黨"},"color":"#25649a","constitution":{"fr":"Indépendantiste","en":"Pro-independence","zh-Hans":"独立派","yue-Hant":"獨立派"},"summary":{"fr":"Services publics, justice sociale, identité nationale","en":"Public services, social justice, national identity","zh-Hans":"公共服务、社会公义、民族认同","yue-Hant":"公共服務、社會公義、民族認同"},"bio":{"text":{"fr":"Ingénieur en simulation de vol. Sa présentation met en avant l’avenir des générations suivantes et la capacité du Québec à décider de son avenir politique.","en":"Flight-simulation engineer. His profile emphasizes future generations and Québec’s ability to determine its political future.","zh-Hans":"飞行模拟器工程师，候选人介绍强调下一代的未来，以及魁北克自行决定政治前途的能力。","yue-Hant":"飛行模擬器工程師。候選人介紹重視下一代嘅未來，同魁北克自己決定政治前途。"},"refs":[17]},"personal":{"text":{"fr":"Indépendance, amélioration des services publics, justice sociale et environnement. Les sources consultées détaillent davantage la vision provinciale que des projets locaux chiffrés.","en":"Independence, better public services, social justice and the environment. Available sources describe a provincial vision more than costed local projects.","zh-Hans":"主张独立、改善公共服务、社会公义和环境保护；可查介绍更侧重全省方向，而非有预算的本区项目。","yue-Hant":"主張獨立、改善公共服務、社會公義同環保。查到嘅介紹主要講全省方向，唔係逐項有預算嘅本區工程。"},"refs":[17]},"orientation":{"text":{"fr":"Indépendantisme et identité francophone, avec une place importante aux services publics. La position constitutionnelle ne résume pas toutes les politiques sociales ou migratoires.","en":"Independence and French-language national identity, with emphasis on public services. Constitutional alignment does not describe every social or immigration policy.","zh-Hans":"支持独立和法语民族认同，重视公共服务。独立立场不能概括其所有社会或移民政策。","yue-Hant":"支持獨立同法語民族認同，重視公共服務。唔可以單靠獨立立場，概括晒佢嘅社會同移民政策。"},"refs":[17,18,21]},"policies":[{"title":{"fr":"Santé","en":"Health care","zh-Hans":"医疗","yue-Hant":"醫療"},"text":{"fr":"Renforcer la prévention et les CLSC; abolir l’organisme de gestion Santé Québec pour réinvestir dans les soins directs. Ce n’est pas abolir les soins publics.","en":"Strengthen prevention and CLSCs; abolish the Santé Québec management agency to reinvest in direct care, not abolish public health care.","zh-Hans":"加强预防医疗和CLSC；取消Santé Québec管理机构并把资源投入直接护理，不是取消公营医疗。","yue-Hant":"加強預防醫療同CLSC；取消Santé Québec管理機構，將資源放返落直接護理，唔係取消公營醫療。"},"refs":[18,19]},{"title":{"fr":"Premiers engagements","en":"Initial priorities","zh-Hans":"优先措施","yue-Hant":"優先措施"},"text":{"fr":"Mesures sur les biens usagés, la taxe sur l’essence, l’aide alimentaire et l’itinérance; démarche sur l’éducation annoncée pour l’hiver 2027.","en":"Measures on used goods, gasoline tax, food assistance and homelessness; an education initiative proposed for winter 2027.","zh-Hans":"提出二手物品税务、汽油税、食物援助和无家者支持措施，并计划2027年冬季开展教育整体讨论。","yue-Hant":"提出二手物品稅務、汽油稅、食物援助同無家者支援措施，計劃2027年冬季討論教育整體方向。"},"refs":[20]},{"title":{"fr":"Immigration","en":"Immigration","zh-Hans":"移民","yue-Hant":"移民"},"text":{"fr":"Réduire les volumes d’immigration permanente et temporaire et renforcer les exigences de français. Ce sont des objectifs du parti, pas les règles en vigueur.","en":"Reduce permanent and temporary immigration levels and strengthen French requirements. These are party objectives, not current rules.","zh-Hans":"降低永久和临时移民规模，提高法语要求。这是政党目标，并非现行规定。","yue-Hant":"降低永久同臨時移民規模，提高法語要求。呢啲係黨嘅目標，唔係現行規定。"},"refs":[21]}],"limits":{"fr":"L’élection du 5 octobre n’est pas un référendum. Aucune date de référendum n’est déduite ici.","en":"The October 5 election is not a referendum. No referendum date is inferred here.","zh-Hans":"10月5日省选不是公投，本页不自行推定独立公投日期。","yue-Hant":"10月5日省選唔係公投，呢頁唔會自行估獨立公投日期。"},"links":[17,20,21],"review":"not-found","portrait":"photo-daude","logo":"logo-pq"},{"id":"garceau","name":"Brigitte Garceau","party":"PLQ","partyFull":"Parti libéral du Québec","partyName":{"fr":"Parti libéral du Québec","en":"Québec Liberal Party","zh-Hans":"魁北克自由党","yue-Hant":"魁北克自由黨"},"color":"#b4464a","constitution":{"fr":"Fédéraliste","en":"Federalist","zh-Hans":"联邦派","yue-Hant":"聯邦派"},"summary":{"fr":"Libéralisme, entreprises et services publics","en":"Liberalism, business and public services","zh-Hans":"自由主义、企业发展与公共服务","yue-Hant":"自由主義、企業發展同公共服務"},"bio":{"text":{"fr":"Élue en 2022, avocate en droit de la famille admise au Barreau en 1992. Études à Carleton, à Ottawa et à l’Université de Montréal. Ancienne présidente du conseil du Refuge pour les femmes de l’Ouest-de-l’Île; travail parlementaire en condition féminine et protection de la jeunesse.","en":"Elected in 2022; family lawyer admitted to the Québec Bar in 1992. Studied at Carleton, Ottawa and Université de Montréal. Former chair of the West Island Women’s Shelter; legislative work on women’s status and youth protection.","zh-Hans":"2022年当选，家庭法律师，1992年加入魁北克律师公会。曾就读Carleton、渥太华大学及蒙特利尔大学；曾任西岛妇女庇护所董事会主席，议会工作涉及妇女地位和青少年保护。","yue-Hant":"2022年當選，係家庭法律師，1992年加入魁北克律師公會。讀過Carleton、Ottawa同蒙特利爾大學；做過西島婦女庇護所董事會主席，議會工作涉及婦女地位同青少年保護。"},"refs":[22,39]},"personal":{"text":{"fr":"Dans l’entrevue de CityNews du 28 septembre 2026 : logement, pauvreté dans l’Ouest-de-l’Île et respect des droits des communautés anglophones et des minorités culturelles.","en":"In CityNews’s September 28, 2026 interview: housing, West Island poverty, and rights and respect for English-speaking and cultural minority communities.","zh-Hans":"2026年9月28日接受CityNews采访时强调住房、西岛贫困问题，以及英语和文化少数社群的权利与尊重。","yue-Hant":"喺2026年9月28日CityNews訪問入面，重點講住房、西島貧窮問題，同英語及文化少數社群嘅權利同尊重。"},"refs":[13]},"orientation":{"text":{"fr":"Libéralisme et fédéralisme canadien; combine développement des entreprises, services publics et droits individuels. Le qualifier uniquement de gauche ou de droite serait réducteur.","en":"Liberalism and Canadian federalism, combining business development, public services and individual rights. A simple left or right label misses this mix.","zh-Hans":"加拿大联邦派和自由主义取向，同时强调企业发展、公共服务及个人权利，不能简单归为纯左或纯右。","yue-Hant":"加拿大聯邦派同自由主義取向，兼顧企業發展、公共服務同個人權利，唔可以淨係當純左或者純右。"},"refs":[23,24]},"policies":[{"title":{"fr":"Santé","en":"Health care","zh-Hans":"医疗","yue-Hant":"醫療"},"text":{"fr":"Télémédecine publique sans rendez-vous, équipes de première ligne et CLSC renforcés.","en":"Public walk-in telemedicine, stronger first-line teams and CLSCs.","zh-Hans":"公共免预约远程诊疗，强化基层跨专业团队和CLSC。","yue-Hant":"公共免預約遙距診症，加強第一線跨專業團隊同CLSC。"},"refs":[23]},{"title":{"fr":"École et garde","en":"Schools & child care","zh-Hans":"教育与托儿","yue-Hant":"教育同托兒"},"text":{"fr":"Plus de soutien spécialisé à l’école; convertir 10 000 places de garde en places subventionnées et ajouter 5 000 places en CPE.","en":"More specialist school support; convert 10,000 child-care places to subsidized places and add 5,000 CPE places.","zh-Hans":"增加学校专业支援；将10,000个托儿名额转为补贴名额，新增5,000个CPE名额。","yue-Hant":"增加學校專業支援；將10,000個托兒名額轉做資助名額，再加5,000個CPE名額。"},"refs":[23]},{"title":{"fr":"Économie et familles","en":"Economy & families","zh-Hans":"经济与家庭","yue-Hant":"經濟同家庭"},"text":{"fr":"Alléger l’impôt des PME, ajouter deux semaines de prestations parentales et développer le soutien à domicile.","en":"Reduce SME taxes, add two weeks of parental benefits and expand home support.","zh-Hans":"降低中小企业税负，增加两周育儿福利并加强居家支援。","yue-Hant":"減輕中小企稅負，加兩星期育兒福利，同加強居家支援。"},"refs":[23]}],"limits":{"fr":"Ces engagements sont provinciaux, pas des crédits garantis exclusivement à Robert-Baldwin.","en":"These are province-wide promises, not funds guaranteed exclusively to Robert-Baldwin.","zh-Hans":"上述属于全省承诺，并非保证专门拨给Robert-Baldwin的资金。","yue-Hant":"上面係全省承諾，唔係保證專門撥畀Robert-Baldwin嘅資金。"},"links":[22,23,39],"review":"secondary","portrait":"photo-garceau","logo":"logo-plq"},{"id":"lacoste","name":"Alexandra Lacoste","party":"QS","partyFull":"Québec solidaire","partyName":{"fr":"Québec solidaire","en":"Québec solidaire","zh-Hans":"魁北克团结党","yue-Hant":"魁北克團結黨"},"color":"#ba602d","constitution":{"fr":"Indépendantiste","en":"Pro-independence","zh-Hans":"独立派","yue-Hant":"獨立派"},"summary":{"fr":"Gauche, redistribution et environnement","en":"Left-wing, redistribution and environment","zh-Hans":"左翼、再分配与环境保护","yue-Hant":"左翼、再分配同環保"},"bio":{"text":{"fr":"Ingénieure avec environ vingt ans d’expérience en projets énergétiques selon sa présentation officielle. Met l’accent sur l’égalité des chances, les droits humains et une répartition plus juste des ressources.","en":"Engineer with about twenty years’ experience in energy projects, according to her official profile. Emphasizes equal opportunity, human rights and a fairer distribution of resources.","zh-Hans":"工程师，官方介绍列有约20年能源项目经验，强调机会平等、人权以及更公平的资源分配。","yue-Hant":"工程師，官方介紹話有大約20年能源項目經驗，重視平等機會、人權同更公平嘅資源分配。"},"refs":[25]},"personal":{"text":{"fr":"Santé, jeunesse, personnes aînées, éducation, francisation et intégration des nouveaux arrivants. Évoque aussi l’empathie à l’école et l’opposition aux exportations de pièces d’armes.","en":"Health care, young people, seniors, education, French learning and newcomer integration; also empathy in schools and opposition to weapons-parts exports.","zh-Hans":"加强医疗，支援青年及长者，投资教育和新移民法语学习与融入；也提出学校重视同理心、反对出口武器零件。","yue-Hant":"加強醫療、支援青年同長者、投資教育，改善新移民學法語同融入；亦提出學校教同理心，同反對出口武器零件。"},"refs":[25]},"orientation":{"text":{"fr":"Gauche, féminisme, écologie et indépendance; services publics, redistribution et protection des locataires.","en":"Left-wing, feminist, environmentalist and pro-independence; emphasizes public services, redistribution and tenant protection.","zh-Hans":"左翼、女性主义、环境保护和独立派，重视公共服务、财富再分配及租客保障。","yue-Hant":"左翼、女性主義、環保同獨立派，重視公共服務、財富再分配同租客保障。"},"refs":[25,26]},"policies":[{"title":{"fr":"Loyers","en":"Rents","zh-Hans":"租金","yue-Hant":"租金"},"text":{"fr":"Plafonner les hausses de loyer à l’inflation pendant un an et revoir le calcul des hausses. Ce n’est pas un gel à 0 %.","en":"Cap rent increases at inflation for one year and reform the calculation. This is not a zero-increase freeze.","zh-Hans":"一年内租金涨幅不超过通胀，并改革涨租计算方式，不是零涨幅冻结。","yue-Hant":"一年內租金加幅唔高過通脹，再改革加租計法，唔係零加幅凍租。"},"refs":[26]},{"title":{"fr":"Logement collectif","en":"Community housing","zh-Hans":"社区住房","yue-Hant":"社區住房"},"text":{"fr":"Accroître le logement social et communautaire et protéger les locataires.","en":"Expand social and community housing and protect tenants.","zh-Hans":"增加社会和社区住房，强化租客保障。","yue-Hant":"增加社會同社區住宅，加強租客保障。"},"refs":[26]},{"title":{"fr":"Alimentation","en":"Groceries","zh-Hans":"食品价格","yue-Hant":"食品價格"},"text":{"fr":"Environ quinze épiceries publiques, à faible marge, pour agir sur le coût de l’alimentation. Les économies restent un effet attendu.","en":"About fifteen low-margin public grocery stores to address food costs. Savings remain an intended outcome.","zh-Hans":"提出约15间低利润率公共杂货店以降低食品开支，降价成效仍属于政策预期。","yue-Hant":"提出大約15間低利潤公共雜貨店，想減低食品開支；效果仲係政策預期。"},"refs":[27]}],"limits":{"fr":"Les priorités personnelles ne sont pas toutes assorties d’un budget local. QS et le PQ partagent l’objectif d’indépendance, pas nécessairement leurs politiques économiques ou migratoires.","en":"Not every personal priority has a local budget. QS and PQ share an independence goal, not necessarily economic or immigration policies.","zh-Hans":"本人主张并非全部附有本区预算；与PQ同为独立派，不代表经济或移民政策相同。","yue-Hant":"本人主張唔係項項都有本區預算；同PQ一樣支持獨立，唔代表經濟同移民政策一樣。"},"links":[25,26,27],"review":"not-found","portrait":"photo-lacoste","logo":"logo-qs"},{"id":"lellouche","name":"Axel Lellouche","party":"PCQ","partyFull":"Parti conservateur du Québec","partyName":{"fr":"Parti conservateur du Québec","en":"Conservative Party of Québec","zh-Hans":"魁北克保守党","yue-Hant":"魁北克保守黨"},"color":"#254b79","constitution":{"fr":"Autonomie au sein du Canada","en":"Autonomy within Canada","zh-Hans":"加拿大内自主派","yue-Hant":"加拿大內自主派"},"summary":{"fr":"Droite économique, impôts et réglementation réduits","en":"Economic right, lower taxes and regulation","zh-Hans":"经济右派、减税和减少监管","yue-Hant":"經濟右派、減稅同減規管"},"bio":{"text":{"fr":"Originaire de la région parisienne, arrivé au Québec en 1997. Formation en biologie et biotechnologies, carrière pharmaceutique puis conseil financier; dirige son propre cabinet depuis 2021 selon sa biographie de candidature.","en":"From the Paris region; moved to Québec in 1997. Studied biology and biotechnology, worked in pharmaceuticals and then financial services; his candidate biography says he has run his own practice since 2021.","zh-Hans":"来自法国巴黎地区，1997年移居魁北克。学习生物学及生物科技，先从事制药业，后转向理财服务；候选人履历称2021年起经营自己的顾问业务。","yue-Hant":"來自法國巴黎地區，1997年移居魁北克。讀過生物學同生物科技，先做藥業，後來轉做理財服務；候選人履歷話2021年開始經營自己嘅顧問業務。"},"refs":[28,40]},"personal":{"text":{"fr":"Trois priorités personnelles : pouvoir d’achat des familles, accès à la propriété et accès aux soins.","en":"Three personal priorities: families’ purchasing power, access to home ownership and access to health care.","zh-Hans":"本人提出三项优先目标：家庭购买力、置业机会和医疗可及性。","yue-Hant":"本人提出三個重點：家庭購買力、置業機會同睇醫生嘅便利程度。"},"refs":[28]},"orientation":{"text":{"fr":"Droite économique et budgétaire : baisse d’impôts, réduction de la réglementation et choix individuel. Recherche davantage d’autonomie québécoise au sein du Canada.","en":"Economic and fiscal right: lower taxes, less regulation and individual choice. Seeks more autonomy for Québec within Canada.","zh-Hans":"经济及财政偏右，主张减税、减少监管和个人选择；支持魁北克在加拿大内争取更多自主权。","yue-Hant":"經濟同財政偏右，主張減稅、減規管同個人選擇；支持魁北克喺加拿大內爭取更多自主權。"},"refs":[29,31]},"policies":[{"title":{"fr":"Fiscalité","en":"Taxation","zh-Hans":"税务","yue-Hant":"稅務"},"text":{"fr":"Réduire l’impôt sur le revenu, les formalités administratives et certains prélèvements liés à l’énergie et à l’essence.","en":"Reduce income taxes, administrative burdens and some energy- and gasoline-related levies.","zh-Hans":"降低所得税、行政负担及部分能源和汽油相关税费。","yue-Hant":"減入息稅、行政負擔，同部分能源及汽油相關稅費。"},"refs":[29]},{"title":{"fr":"Soins mixtes","en":"Mixed health-care delivery","zh-Hans":"公私混合医疗","yue-Hant":"公私混合醫療"},"text":{"fr":"Pratique médicale mixte et recours à des fournisseurs externes financés publiquement lorsque nécessaire; ne signifie pas que tout patient paie lui-même tous ses soins.","en":"Mixed medical practice and publicly funded external providers where needed; not a claim that every patient must pay privately for all care.","zh-Hans":"允许医生公私混合执业，必要时公费采购外部服务，不能概括成所有病人自行付费。","yue-Hant":"容許醫生公私混合執業，有需要時公費買外部服務，唔係話所有病人都要自己畀錢。"},"refs":[30]},{"title":{"fr":"Autonomie","en":"Autonomy","zh-Hans":"自主权","yue-Hant":"自主權"},"text":{"fr":"Modifier le partage des pouvoirs sans viser à séparer le Québec du Canada.","en":"Change the division of powers without seeking Québec’s separation from Canada.","zh-Hans":"调整联邦与省的权力分配，不以魁北克脱离加拿大为目标。","yue-Hant":"調整聯邦同省嘅權力分配，唔以魁北克離開加拿大為目標。"},"refs":[31]}],"limits":{"fr":"Les instruments détaillés sont surtout dans le programme du parti, pas dans un engagement budgétaire propre à cette circonscription.","en":"Detailed tools mainly appear in the party platform, not a district-specific budget commitment.","zh-Hans":"具体政策工具主要见于全党政纲，而非候选人专属本区拨款承诺。","yue-Hant":"具體政策工具主要喺全黨政綱，唔係候選人專屬本區撥款承諾。"},"links":[28,29,40],"review":"not-found","portrait":"photo-lellouche","logo":"logo-pcq"},{"id":"leroux","name":"Sophie Leroux","party":"CAQ","partyFull":"Coalition avenir Québec","partyName":{"fr":"Coalition avenir Québec","en":"Coalition avenir Québec","zh-Hans":"魁北克未来联盟","yue-Hant":"魁北克未來聯盟"},"color":"#318995","constitution":{"fr":"Autonomie au sein du Canada","en":"Autonomy within Canada","zh-Hans":"加拿大内自主派","yue-Hant":"加拿大內自主派"},"summary":{"fr":"Gestion économique, investissements, partenariats","en":"Economic management, investment, partnerships","zh-Hans":"经济管理、公共投资、公私协作","yue-Hant":"經濟管理、公共投資、公私協作"},"bio":{"text":{"fr":"Professionnelle des communications et de la gestion de projets, avec plus de 25 ans d’expérience selon sa présentation : projets informatiques, ententes commerciales et gestion organisationnelle. Active à la CAQ depuis 2012.","en":"Communications and project-management professional with more than 25 years of experience according to her profile: IT projects, marketing agreements and organizational management. Active in the CAQ since 2012.","zh-Hans":"传播与项目管理专业人士，官方履历列有逾25年经验，涉及IT项目、营销协议和组织管理；2012年起参与CAQ。","yue-Hant":"傳訊同項目管理專業人士，官方履歷列有超過25年經驗，做過IT項目、營銷協議同組織管理；2012年起參與CAQ。"},"refs":[32]},"personal":{"text":{"fr":"Mise sur les investissements en infrastructures. Dans CityNews, défend la protection du français tout en affirmant que les communautés anglophones et allophones doivent être entendues et avoir accès aux services.","en":"Emphasizes infrastructure investment. In CityNews, supports protecting French while saying English-speaking and allophone communities should be heard and have access to services.","zh-Hans":"强调基础设施投资；接受CityNews采访时表示，在保护法语的同时，英语及其他语言社群应获得服务并被听见。","yue-Hant":"重點講基建投資；接受CityNews訪問時話，要保護法語，同時英語同其他語言社群都應該有服務，同有人聽佢哋意見。"},"refs":[13]},"orientation":{"text":{"fr":"Nationalisme et autonomie dans le Canada, avec une approche axée sur la gestion, les entreprises et la collaboration public-privé plutôt que sur l’indépendance.","en":"Nationalism and autonomy within Canada, with a management-, business- and public–private partnership approach rather than independence.","zh-Hans":"加拿大内的魁北克民族及自主取向，强调管理、企业与公私协作，不以独立为目标。","yue-Hant":"喺加拿大內爭取魁北克民族認同同自主，重視管理、企業同公私合作，唔以獨立為目標。"},"refs":[13,33,34]},"policies":[{"title":{"fr":"Attente en santé","en":"Health-care waits","zh-Hans":"医疗轮候","yue-Hant":"醫療輪候"},"text":{"fr":"Acheter certains services au privé avec financement public, notamment en imagerie, et renforcer les soins de première ligne.","en":"Publicly purchase some private services, including imaging, and strengthen first-line care.","zh-Hans":"公费采购部分私人服务，包括影像检查，并加强基层医疗。","yue-Hant":"公費採購部分私人服務，包括影像檢查，再加強第一線醫療。"},"refs":[33]},{"title":{"fr":"Infrastructures","en":"Infrastructure","zh-Hans":"基础设施","yue-Hant":"基建"},"text":{"fr":"Poursuivre les investissements dans les infrastructures et les services publics dans son cadre financier.","en":"Continue infrastructure and public-service investment under its fiscal framework.","zh-Hans":"在财政框架下继续投资基础设施和公共服务。","yue-Hant":"按財政框架繼續投資基建同公共服務。"},"refs":[34]},{"title":{"fr":"Cadre financier","en":"Fiscal framework","zh-Hans":"财政框架","yue-Hant":"財政框架"},"text":{"fr":"Vise un retour à l’équilibre budgétaire en 2029–2030; il s’agit d’une projection, pas d’un résultat assuré.","en":"Targets a balanced budget in 2029–2030; this is a projection, not an assured outcome.","zh-Hans":"提出2029–2030年度恢复财政平衡目标，这是预测而非保证。","yue-Hant":"目標係2029–2030年度恢復財政平衡；呢個係預測，唔係保證。"},"refs":[34]}],"limits":{"fr":"Les investissements provinciaux ne constituent  <section class="section" id="people" data-position="people">${sectionHead('03',u('eyebrowPeople'),s('peopleTitle'),textBlock(D.sections.peopleIntro))}<div class="stats">${[['77,275','statPopulation'],['41.2%','statImmigrant'],['42.4','statMedian'],['19.7%','statSenior']].map(([value,key])=>`<div class="stat"><span class="date">${esc(u('census'))}</span><div class="value">${value}</div><span class="label">${esc(u(key))}</span></div>`).join('')}</div><div class="data-detail"><div>${block('peopleLanguages')}</div><p>${esc(s('peopleLimits'))}</p></div><p class="data-note">${esc(u('refs'))}: ${refs([12])}</p></section>
 <section class="section" id="candidates" data-position="candidates">${sectionHead('04',u('eyebrowCandidates'),s('candidatesTitle'),textBlock(D.sections.candidatesIntro))}<h3 class="overview-title">${esc(u('overview'))}</h3><p class="note" style="margin-top:12px">${esc(s('axesNote'))}</p><div class="table-wrap" tabindex="0" role="region" aria-label="${esc(u('overview'))}"><table class="overview"><thead><tr><th>${esc(u('candidateName'))} / ${esc(u('partyName'))}</th><th>${esc(u('constitution'))}</th><th>${esc(u('policyDirection'))}</th></tr></thead><tbody>${D.candidates.map(c=>`<tr><th scope="row"><a class="candidate-jump" href="#${c.id}">${esc(c.name)}</a><span class="row-party">${esc(c.party+' · '+T(c.partyName))}</span>${logo(c,true)}</th><td>${esc(T(c.constitution))}</td><td>${esc(T(c.summary))}</td></tr>`).join('')}</tbody></table></div><p class="table-hint">${esc(u('order'))}</p><div class="callout">${block('acronymNote')}</div><div class="read-key"><span><i class="level-marker person"></i>${esc(u('personal'))}</span><span><i class="level-marker party"></i>${esc(u('platform'))}</span></div><div class="toolbar no-print"><label class="search" for="candidate-search"><input id="candidate-search" type="search" placeholder="${esc(u('search'))}" aria-label="${esc(u('search'))}" value="${esc(term)}" autocomplete="off"></label><span class="count" id="candidate-count" aria-live="polite"></span><button class="button small secondary" id="clear-filter" type="button">${esc(u('all'))}</button></div><div class="jump-list no-print">${D.candidates.map(c=>`<a href="#${c.id}" class="jump-chip candidate-jump"><span style="background:${c.color}"></span>${esc(c.name)}</a>`).join('')}</div><div class="empty" id="empty" hidden>${esc(u('empty'))}</div><div class="candidates">${D.candidates.map(candidate).join('')}</div></section>
 <section class="section" id="review" data-position="review">${sectionHead('05',u('eyebrowReview'),u('reviewTitle'),esc(s('reviewIntro')))}<div class="review-grid">${D.candidates.map(review).join('')}</div><div class="review-notes"><p>${esc(s('reviewMethod'))}</p><a href="#research-method">${esc(u('researchLink'))} ↓</a></div></section>
 <section class="section" id="sources" data-position="sources">${sectionHead('06',u('eyebrowSources'),s('sourcesTitle'),esc(s('sourcesIntro')))}<div class="source-explain"><p>${esc(s('sourcesMethod'))}</p><p>${esc(s('privacyNote'))}</p></div><details class="source-disclosure" id="source-details"><summary class="sources-heading">${esc(u('sourceDetails'))} · ${D.sources.length}</summary><ol class="sources">${D.sources.map(source=>`<li id="source-${source.id}" data-position="source-${source.id}"><span class="source-number">${String(source.id).padStart(2,'0')}</span><div><span class="source-kind">${esc(u('source'+source.kind[0].toUpperCase()+source.kind.slice(1)))}</span>${external(source.url,source.title,'')}<span class="source-url">${esc(source.url)}</span></div></li>`).join('')}</ol></details><details class="source-disclosure" id="credit-details"><summary class="sources-heading">${esc(u('creditDetails'))}</summary><p class="note">${esc(s('rightsNote'))}</p><ul class="credit-list">${credits()}</ul></details><details class="source-disclosure" id="research-method"><summary class="sources-heading">${esc(u('researchLink'))} · 2026-10-04</summary><p class="note">${esc(s('reviewMethod'))}</p><p class="note">${esc(u('reviewNoneText'))}</p><div class="legal">${esc(u('researchScope'))}</div></details><p class="note" style="margin-top:23px">${esc(s('disclaimer'))}</p></section></main><footer class="footer"><div class="wrap footer-inner"><div><strong>Robert-Baldwin 2026</strong><p>${esc(u('updated'))} · ${esc(u('nonOfficial'))}</p></div><a href="#top">${esc(u('backTop'))} ↑</a></div></footer>`;
 bind();filter();if(new Date()>=new Date('2026-10-06T00:00:00-04:00'))q('#archive-warning').hidden=false;
 q('#map-dialog-title').textContent=u('fullMap');q('#close-map').textContent=u('close');q('#map-zoom-image').alt=u('mapAlt');q('#map-original-link').href=byId.get(9).url;q('#map-original-link').textContent=u('officialPDF');if(map?.src)q('#map-zoom-image').src=map.src;
 all('img').forEach(img=>{img.addEventListener('error',()=>{const frame=img.closest('.portrait-frame,.party-logo-wrap');if(frame)frame.classList.add('media-failed');else if(img.id!=='map-zoom-image')img.hidden=true;});});
}
const norm=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const searchable=new Map(D.candidates.map(c=>[c.id,norm(JSON.stringify(c))]));
function filter(){const nterm=norm(term);let shown=0;D.candidates.forEach(c=>{const show=!nterm||searchable.get(c.id).includes(nterm);q('#'+c.id).hidden=!show;if(show)shown++;});q('#candidate-count').textContent=u('count').replace('{n}',shown);q('#empty').hidden=shown>0;}
function announce(message){q('#toast').textContent=message;q('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('#toast').hidden=true,5500);}
function clearSearch(){term='';q('#candidate-search').value='';filter();}
function revealHash(scroll=true){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{return}const target=document.getElementById(id);if(!target)return;if(id.startsWith('source-'))q('#source-details').open=true;if(id.startsWith('review-'))target.querySelector('details')?.setAttribute('open','');if(target.classList.contains('candidate'))clearSearch();if(id==='research-method')target.open=true;if(scroll)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));}
function switchLanguage(next){if(!LANGS.includes(next)||next===lang)return;const points=all('[data-position]').filter(e=>!e.hidden&&e.getClientRects().length&&e.getBoundingClientRect().top<=130);const anchor=points.at(-1),id=anchor?.id,offset=anchor?.getBoundingClientRect().top??0,oldY=scrollY;const sourceOpen=q('#source-details').open,creditOpen=q('#credit-details').open;lang=next;try{localStorage.setItem('rb-guide-language',lang)}catch{}try{const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url)}catch{}render();q('#source-details').open=sourceOpen;q('#credit-details').open=creditOpen;requestAnimationFrame(()=>{const a=id&&document.getElementById(id);window.scrollTo({top:a?a.getBoundingClientRect().top+scrollY-offset:oldY,behavior:'instant'});});}
async function share(){if(!/^https?:$/.test(location.protocol)){announce(u('localShare'));return;}const url=new URL(location.href);url.searchParams.set('lang',lang);try{if(navigator.share)await navigator.share({title:u('pageTitle'),text:u('heroDesc'),url:url.href});else if(navigator.clipboard){await navigator.clipboard.writeText(url.href);announce(u('shared'));}else announce(u('manualShare'));}catch(error){if(error.name!=='AbortError')announce(u('manualShare'));}}
function openMap(){if(!M.assets['map-montreal']?.src)return;const dialog=q('#map-dialog');if(typeof dialog.showModal==='function')dialog.showModal();else window.open(M.assets['map-montreal'].src,'_blank','noopener');}
function bind(){q('#language').addEventListener('change',e=>switchLanguage(e.target.value));q('#candidate-search').addEventListener('input',e=>{term=e.target.value;filter();});q('#clear-filter').addEventListener('click',()=>{clearSearch();q('#candidate-search').focus();});all('.candidate-jump').forEach(a=>a.addEventListener('click',clearSearch));q('#share-page').addEventListener('click',share);q('#print-page').addEventListener('click',()=>{clearSearch();q('#source-details').open=true;window.print();});q('#open-map')?.addEventListener('click',openMap);all('[data-open-map]').forEach(b=>b.addEventListener('click',openMap));}
window.addEventListener('hashchange',()=>revealHash());window.addEventListener('beforeprint',()=>{clearSearch();q('#source-details').open=true;all('.review-item details').forEach(d=>d.open=true);});q('#close-map').addEventListener('click',()=>q('#map-dialog').close());q('#map-dialog').addEventListener('click',e=>{if(e.target===q('#map-dialog'))q('#map-dialog').close();});
lang=initialLanguage();render();revealHash();
// Small test surface: locale mapping is deterministic and does not transmit data.
window.RB_GUIDE={setLanguage:switchLanguage,getLanguage:()=>lang,normalizeLocale,version:'2.0.0'};
})();
</script>
